name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # The installer's own test compiles it, so GTK's development files have to be here.
      - name: GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
